[package]
name = "webkit-adblock"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "cxx FFI bridge exposing the adblock-rust `adblock` crate to WebKit (ENABLE(ADBLOCK))."
publish = false

# Keep this crate standalone: it is built by an Xcode script phase (U2), not as
# part of any surrounding cargo workspace.
[workspace]

# Build with panic=abort so no Rust unwinding landing pads (and thus no
# `_rust_eh_personality`) are emitted. WebKit.framework already links Swift, C++,
# and Objective-C exception personalities; a fourth (Rust) overflows macOS's
# 3-personality compact-unwind limit at link time. This matches Chromium/Brave,
# which compile all Rust with panic=abort and rely on adblock-rust being
# panic-free on untrusted filter lists rather than on catching panics at the FFI
# boundary. cargo forces unwind for the test profile, so `cargo test` is
# unaffected.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lib]
name = "webkitadblock"
# `staticlib` produces libwebkitadblock.a for the WebKit framework link (KTD1);
# `rlib` lets `cargo test` build the in-crate test harness.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pin adblock to the 0.12.x line Brave ships (KTD2). Use the embedded domain
# resolver instead of a Chromium-style C++ callback.
adblock = { version = "0.12", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    "single-thread",
    "css-validation",
    "resource-assembler",
] }
cxx = "1.0"
serde_json = "1.0"
thiserror = "1.0"

[build-dependencies]
# Compiles the cxx-generated C++ shim (and the cxx runtime) into
# libwebkitadblock.a and emits the generated headers under target/cxxbridge/
# (U2 build integration). This is the cargo-native equivalent of the
# `cxx_bindings` parameter Chromium's GN rust_static_library gives Brave.
# Kept in lockstep with the `cxx` version above.
cxx-build = "1.0"
